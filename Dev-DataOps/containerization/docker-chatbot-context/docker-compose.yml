version: "3.9"

services:
  ollama:
    image: ollama/ollama:0.3.14
    container_name: ollama
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "ollama serve & sleep 10 && ollama pull gemma:2b && wait"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - chatbot_net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-ui
    ports:
      - "8050:8050"
    environment:
      - OLLAMA_API_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=gemma:2b
    depends_on:
      - ollama
    networks:
      - chatbot_net

networks:
  chatbot_net:
    driver: bridge

volumes:
  ollama_models:
